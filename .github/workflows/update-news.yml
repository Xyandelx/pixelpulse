name: Actualizar noticias

on:
  schedule:
    - cron: "0 * * * *"   # cada hora (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar noticias
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python update_news.py

      - name: Guardar cambios
        run: |
          git config user.name "pixelpulse-bot"
          git config user.email "pixelpulse-bot@users.noreply.github.com"
          git add news.json feed.xml sitemap.xml robots.txt
          git diff --staged --quiet || (git commit -m "Actualizar noticias" && git push)
