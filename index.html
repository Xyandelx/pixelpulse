      <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#12122e"/>

    <p class="tagline" data-i18n="tagline">Tu pulso diario de videojuegos</p>
  </div>
  <svg class="pulse" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="pg" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2e97"/>

  <p class="updated" id="updated"></p>

<main class="wrap" id="main">
  <div class="top" id="top"></div>
  <h2 class="sec latest-title" id="latestTitle" data-i18n="latest" hidden>Últimas noticias</h2>
